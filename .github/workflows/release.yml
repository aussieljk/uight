# Every push to master is a release.
#
# Bump the canary counter, run the gates, publish to npm under `latest`, push
# the version commit back. No inputs, no approval, no decisions — if it lands
# on master it ships.
#
# The version can only ever be `0.0.1-canary.N`: `packages/uight/scripts/
# version.ts` refuses to bump anything else, and the check below refuses to
# publish anything else. Leaving the series takes a deliberate `--set` by hand.
#
# The release commit carries `[skip ci]` so it does not trigger this workflow
# again. Without it, every release would release.
#
# Authentication is OIDC trusted publishing — no `NPM_TOKEN` exists. Set up on
# npmjs.com under Settings → Trusted publisher: `aussieljk` / `uight` /
# `release.yml`, no environment.

name: Release

on:
 push:
  branches: [master]

concurrency:
 group: release
 cancel-in-progress: false

permissions:
 # Mint the OIDC token npm trades for a publish credential.
 id-token: write
 # Push the version commit and its tag back to master.
 contents: write

jobs:
 release:
  runs-on: ubuntu-latest

  steps:
   - uses: actions/checkout@v4
     with:
      ref: master

   - uses: oven-sh/setup-bun@v2
     with:
      bun-version: latest

   # Bun runs the repository; npm does the publishing, and only a recent npm
   # knows how to authenticate with OIDC. `setup-node` is here for that npm.
   #
   # Deliberately no `registry-url`: it writes an `.npmrc` pointing `_authToken`
   # at `NODE_AUTH_TOKEN`, and with no such token that is an empty credential
   # npm sends before it ever considers OIDC.
   - uses: actions/setup-node@v4
     with:
      node-version: "22"

   - name: npm with trusted publishing support
     run: npm install -g npm@latest

   - name: Install
     run: bun install --frozen-lockfile

   - name: Bump the canary counter
     run: bun run version:bump
     working-directory: packages/uight

   - name: Read the version
     id: version
     run: echo "version=$(node -p "require('./packages/uight/package.json').version")" >> "$GITHUB_OUTPUT"

   # Belt and braces: `version.ts --bump` cannot produce anything else, so this
   # can only fire if package.json was hand-edited off the series.
   - name: Refuse anything that is not 0.0.1-canary.N
     run: |
      version="${{ steps.version.outputs.version }}"
      if [[ ! "$version" =~ ^0\.0\.1-canary\.[0-9]+$ ]]; then
        echo "::error::$version is not in the 0.0.1-canary.N series."
        exit 1
      fi

   # Every gate, then the publish. `scripts/release.ts` is the single
   # description of what a release is, so this and a release from a laptop
   # cannot drift apart. `--tag latest` is explicit: a prerelease published
   # without it does not move `latest`, which is what left a plain install
   # resolving to canary.0 forever.
   #
   # Provenance is automatic — public repo, public package, OIDC.
   - name: Release
     run: bun run release --tag latest

   # After the publish: a failed release must not leave master claiming a
   # version that was never released.
   - name: Push the version commit
     env:
      VERSION: ${{ steps.version.outputs.version }}
     run: |
      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      git add packages/uight/package.json packages/uight/src/shared/version.ts
      git commit -m "release: uight $VERSION [skip ci]"
      git tag -a "v$VERSION" -m "uight $VERSION"
      git push origin master --follow-tags

   - name: Summary
     run: |
      {
        echo "### uight ${{ steps.version.outputs.version }}"
        echo
        echo 'Published to npm under `latest`.'
      } >> "$GITHUB_STEP_SUMMARY"
