name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# A second push to the same branch makes the first run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      # One command, deliberately: `bun run verify` is exactly what
      # `bun run release` runs before it publishes, so CI and the release path
      # cannot drift into checking different things. It runs the gates in the
      # order that makes them meaningful — the stylesheet check before the build
      # rather than after it, and the build before the type check, because
      # `uaight/client` resolves its types through the package's own `dist`.
      #
      # It ends in `npm publish --dry-run`, which needs no auth and catches
      # packaging defects (a bad `bin` path, a missing README) that no amount of
      # source-level checking can see.
      - name: Verify
        run: bun run verify

      # NOTE: `oxfmt --check` is deliberately not a gate yet. oxfmt 0.61 with no
      # config disagrees with 205 of this repository's 209 files, so turning it
      # on means one reformat commit touching everything. Worth doing — as its
      # own change, with a committed config, not as a side effect of CI.
