name: CI

on:
 push:
  branches: [main, master]
 pull_request:

# A second push to the same branch makes the first run irrelevant.
concurrency:
 group: ${{ github.workflow }}-${{ github.ref }}
 cancel-in-progress: true

jobs:
 check:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4

   - uses: oven-sh/setup-bun@v2
     with:
      bun-version: latest

   - name: Install
     run: bun install --frozen-lockfile

   # One command, deliberately: `bun run verify` is exactly what
   # `bun run release` runs before it publishes, so CI and the release path
   # cannot drift into checking different things. It runs the gates in the
   # order that makes them meaningful — the stylesheet check before the build
   # rather than after it, and the build before the type check, because
   # `uaight/client` resolves its types through the package's own `dist`.
   #
   # It ends in `npm publish --dry-run`, which needs no auth and catches
   # packaging defects (a bad `bin` path, a missing README) that no amount of
   # source-level checking can see.
   - name: Verify
     run: bun run verify

   # Formatting is its own gate rather than part of `verify`: `verify` is the
   # release path, and a release must not be blocked by whitespace. The
   # config it reads is committed (`.oxfmtrc.json`), so this and a developer's
   # `bun run format` cannot disagree.
   - name: Format
     run: bun run format:check

   # §20.3's budgets, failing on regression. It runs after `verify` because it
   # measures the built chrome bundle, and `verify` is what builds it.
   #
   # Only the four rows that are measurable without a browser: plugin startup
   # at 100 and 500 fixture modules, the incremental index, and the chrome
   # bundle. First paint, the frame handshake, memory across mount/unmount
   # cycles and HMR latency need Playwright and are not approximated here.
   - name: Budgets
     run: bun run bench

 # §20.2 — "required, not optional". A separate job because it installs three
 # browser engines, which the check job has no use for, and because a matrix
 # failure should read as "the browsers disagree", not as a broken build.
 #
 # It needs the package built: the e2e apps consume `packages/uaight/dist`
 # rather than the source, which is what makes them a test of what ships.
 e2e:
  needs: check
  runs-on: ubuntu-latest
  timeout-minutes: 30
  strategy:
   fail-fast: false
   # Sharded across three runners. The matrix is wall-clock bound on browser
   # startup, not on anything a bigger box fixes, so the only lever is more
   # boxes; Playwright's own sharding splits by test, not by file.
   matrix:
    shard: [1, 2, 3]
  steps:
   - uses: actions/checkout@v4

   - uses: oven-sh/setup-bun@v2
     with:
      bun-version: latest

   - name: Install
     run: bun install --frozen-lockfile

   - name: Build
     run: bun run build

   # The e2e apps are deliberately NOT workspaces, so the React 18 cell can
   # hold its own React without disturbing the root install.
   - name: Install e2e apps
     run: bun run test:e2e:install

   # Keyed on the PINNED Playwright version: the engines only change when that
   # does, and pulling three of them on every run was a minute of every run.
   - name: Cache browsers
     id: playwright-cache
     uses: actions/cache@v4
     with:
      path: ~/.cache/ms-playwright
      key: playwright-1.62.1-${{ runner.os }}

   - name: Install browsers
     run: bun run test:e2e:browsers
     if: steps.playwright-cache.outputs.cache-hit != 'true'

   # A cache hit still needs the shared libraries the engines link against;
   # those live outside ~/.cache and are not part of the cached tree.
   - name: Install browser system dependencies
     run: tests/e2e/node_modules/.bin/playwright install-deps
     if: steps.playwright-cache.outputs.cache-hit == 'true'

   # Vite re-prebundles React for every dev server on a cold boot — four
   # servers, every run. The optimizer cache is keyed on the lockfiles that
   # decide what is IN it, so a dependency change invalidates it correctly.
   - name: Cache the Vite dep optimizer
     uses: actions/cache@v4
     with:
      path: |
       tests/e2e/fixture-app/node_modules/.vite
       tests/e2e/fixture-app-react18/node_modules/.vite
      key: vite-deps-${{ runner.os }}-${{ hashFiles('tests/e2e/fixture-app/bun.lock', 'tests/e2e/fixture-app-react18/bun.lock') }}

   - name: Matrix
     run: bun run test:e2e -- --shard=${{ matrix.shard }}/3
     env:
      CI: "1"
      PLAYWRIGHT_SERVERS: all

   - uses: actions/upload-artifact@v4
     if: ${{ !cancelled() }}
     with:
      name: playwright-report-${{ matrix.shard }}
      path: tests/e2e/report
      retention-days: 7
