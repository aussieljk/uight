name: CI

on:
 push:
  branches: [main, master]
 pull_request:

# A second push to the same branch makes the first run irrelevant.
concurrency:
 group: ${{ github.workflow }}-${{ github.ref }}
 cancel-in-progress: true

jobs:
 check:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4

   - uses: oven-sh/setup-bun@v2
     with:
      bun-version: latest

   - name: Install
     run: bun install --frozen-lockfile

   # One command, deliberately: `bun run verify` is exactly what
   # `bun run release` runs before it publishes, so CI and the release path
   # cannot drift into checking different things. It runs the gates in the
   # order that makes them meaningful — the stylesheet check before the build
   # rather than after it, and the build before the type check, because
   # `uight/client` resolves its types through the package's own `dist`.
   #
   # It ends in `npm publish --dry-run`, which needs no auth and catches
   # packaging defects (a bad `bin` path, a missing README) that no amount of
   # source-level checking can see.
   - name: Verify
     run: bun run verify

   # Formatting is its own gate rather than part of `verify`: `verify` is the
   # release path, and a release must not be blocked by whitespace. The
   # config it reads is committed (`.oxfmtrc.json`), so this and a developer's
   # `bun run format` cannot disagree.
   - name: Format
     run: bun run format:check

   # §20.3's budgets, failing on regression. It runs after `verify` because it
   # measures the built chrome bundle, and `verify` is what builds it.
   #
   # Only the four rows that are measurable without a browser: plugin startup
   # at 100 and 500 fixture modules, the incremental index, and the chrome
   # bundle. First paint, the frame handshake, memory across mount/unmount
   # cycles and HMR latency would need a browser harness, which no longer
   # exists in this repository, and are not approximated here.
   - name: Budgets
     run: bun run bench
